<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Multi Spotting Site — транспортная галерея</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flag-icons@7.2.3/css/flag-icons.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0a0e17; color: #e8edf5; line-height: 1.5; }
        .header { background: #070b12; border-bottom: 1px solid #2a3a4a; padding: 0.8rem 2rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; position: sticky; top: 0; z-index: 100; }
        .logo-area { display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .logo { font-size: 1.5rem; }
        .site-title { font-size: 1.1rem; font-weight: 700; background: linear-gradient(135deg, #fff, #4a9eff); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .menu-btn { background: none; border: 1px solid #2a3a4a; font-size: 1.2rem; cursor: pointer; color: #4a9eff; padding: 6px 12px; border-radius: 6px; position: relative; }
        .notif-badge { position: absolute; top: -5px; right: -5px; background: #e74c3c; color: white; border-radius: 50%; padding: 2px 6px; font-size: 0.6rem; font-weight: bold; }
        .user-info { display: flex; align-items: center; gap: 15px; flex-wrap: wrap; }
        .admin-badge { background: #e74c3c; padding: 2px 10px; border-radius: 20px; font-size: 0.65rem; font-weight: bold; }
        .moder-badge { background: #3498db; padding: 2px 10px; border-radius: 20px; font-size: 0.65rem; font-weight: bold; }
        .banned-badge { background: #7f8c8d; padding: 2px 10px; border-radius: 20px; font-size: 0.65rem; font-weight: bold; }
        .side-menu { position: fixed; top: 0; right: -100%; width: 85%; max-width: 320px; height: 100%; background: #0a0e17; border-left: 1px solid #2a3a4a; transition: 0.3s ease; z-index: 200; padding: 20px; overflow-y: auto; }
        .side-menu.open { right: 0; }
        .menu-header { display: flex; justify-content: space-between; margin-bottom: 25px; font-weight: bold; color: #4a9eff; border-bottom: 1px solid #2a3a4a; padding-bottom: 10px; }
        .menu-list { list-style: none; }
        .menu-list li { padding: 12px 0; border-bottom: 1px solid #1a2332; cursor: pointer; display: flex; align-items: center; gap: 12px; }
        .menu-list li i { width: 24px; color: #4a9eff; }
        .menu-list li:hover { color: #4a9eff; padding-left: 10px; background: rgba(74,158,255,0.1); }
        .container { max-width: 1400px; margin: 20px auto; padding: 0 20px; }
        .section { background: #0f141c; border-radius: 20px; padding: 24px; margin-bottom: 28px; border: 1px solid #2a3a4a; }
        h2, h3 { margin-bottom: 18px; font-weight: 600; display: flex; align-items: center; gap: 10px; border-left: 3px solid #4a9eff; padding-left: 14px; font-size: 1.3rem; }
        .main-two-columns { display: flex; flex-wrap: wrap; gap: 28px; }
        .main-center { flex: 2.5; min-width: 0; }
        .main-sidebar { flex: 1.2; min-width: 280px; display: flex; flex-direction: column; gap: 24px; }
        .side-block { background: #0a0e17; border-radius: 16px; padding: 18px; border: 1px solid #2a3a4a; }
        .side-block h4 { margin-bottom: 14px; font-size: 1rem; display: flex; align-items: center; gap: 8px; color: #4a9eff; border-left: 2px solid #4a9eff; padding-left: 10px; }
        .photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 24px; }
        .photo-card { background: #0a0e17; border-radius: 16px; overflow: hidden; border: 1px solid #2a3a4a; transition: 0.3s; cursor: pointer; position: relative; }
        .photo-card:hover { transform: translateY(-4px); border-color: #4a9eff; }
        .photo-card img { width: 100%; height: 220px; object-fit: cover; }
        .photo-info { padding: 16px; }
        .vehicle-name { font-weight: 700; font-size: 1rem; cursor: pointer; color: #4a9eff; display: inline-block; }
        .vehicle-name:hover { text-decoration: underline; }
        .status-badge { position: absolute; top: 12px; right: 12px; padding: 4px 12px; border-radius: 20px; font-size: 0.7rem; font-weight: 600; background: rgba(0,0,0,0.85); }
        .badge-approved { background: #2ecc71; color: #000; }
        .badge-conditional { background: #3498db; color: #fff; }
        .badge-pending { background: #e67e22; color: #fff; }
        .badge-rejected { background: #e74c3c; color: #fff; }
        .photo-stats { display: flex; gap: 18px; margin-top: 10px; font-size: 0.75rem; color: #8a9bb0; }
        .vote-buttons { display: flex; gap: 12px; margin-top: 10px; }
        .vote-btn { background: rgba(30,42,58,0.8); border: 1px solid #2a3a4a; cursor: pointer; font-size: 0.8rem; padding: 5px 16px; border-radius: 24px; transition: 0.2s; }
        .vote-up { color: #2ecc71; }
        .vote-up:hover { background: rgba(46,204,113,0.2); border-color: #2ecc71; }
        .vote-down { color: #e74c3c; }
        .vote-down:hover { background: rgba(231,76,60,0.2); border-color: #e74c3c; }
        .vote-active-up { background: #2ecc71; color: #000; border-color: #2ecc71; }
        .vote-active-down { background: #e74c3c; color: #fff; border-color: #e74c3c; }
        .form-group { margin-bottom: 20px; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 12px; background: #0a0e17; border: 1px solid #2a3a4a; border-radius: 10px; color: #e8edf5; transition: 0.2s; }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus { outline: none; border-color: #4a9eff; }
        .filter-bar { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
        .filter-chip { background: #0a0e17; padding: 6px 16px; border-radius: 30px; border: 1px solid #3a4a5a; cursor: pointer; font-size: 0.75rem; transition: 0.2s; }
        .filter-chip:hover, .filter-chip.active { background: #4a9eff; color: #000; border-color: #4a9eff; }
        button, .btn { background: #1e2a3a; color: #4a9eff; border: 1px solid #2a3a4a; padding: 8px 20px; border-radius: 8px; cursor: pointer; font-size: 0.85rem; display: inline-flex; align-items: center; gap: 8px; transition: 0.2s; }
        button:hover, .btn:hover { background: #2a3a4a; transform: translateY(-1px); }
        .btn-success { background: #1a3a2a; border-color: #2ecc71; color: #2ecc71; }
        .btn-success:hover { background: #2ecc71; color: #000; }
        .btn-danger { background: #2a1a1a; border-color: #e74c3c; color: #e74c3c; }
        .btn-danger:hover { background: #e74c3c; color: #fff; }
        .btn-warning { background: #3a2a1a; border-color: #e67e22; color: #e67e22; }
        .btn-warning:hover { background: #e67e22; color: #000; }
        .fullscreen-viewer { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 3000; overflow-y: auto; }
        .fullscreen-viewer.active { display: flex; flex-direction: column; }
        .fullscreen-close { position: fixed; top: 20px; right: 25px; font-size: 2rem; cursor: pointer; background: rgba(0,0,0,0.6); border: none; width: 50px; height: 50px; border-radius: 50%; color: white; z-index: 3001; transition: 0.2s; }
        .fullscreen-close:hover { background: #e74c3c; transform: scale(1.05); }
        .fullscreen-image { flex: 1; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .fullscreen-image img { max-width: 90%; max-height: 70vh; object-fit: contain; border-radius: 8px; }
        .fullscreen-info { background: rgba(0,0,0,0.95); padding: 20px 30px; border-top: 1px solid #4a9eff; }
        .comment { background: #0a0e17; padding: 12px; border-radius: 10px; margin-bottom: 10px; display: flex; justify-content: space-between; flex-wrap: wrap; }
        .rules-text { line-height: 1.6; color: #b0b7c5; }
        .rules-text p { margin-bottom: 12px; }
        .timeline-item { padding: 10px 0; border-bottom: 1px solid #2a3a4a; display: flex; gap: 12px; align-items: center; }
        .timeline-date { font-size: 0.7rem; color: #4a9eff; min-width: 70px; }
        .photographer-item { display: flex; gap: 10px; margin-bottom: 12px; align-items: center; cursor: pointer; padding: 8px; border-radius: 10px; transition: 0.2s; }
        .photographer-item:hover { background: #1a2332; transform: translateX(5px); }
        .thumb-strip-small { display: flex; gap: 12px; overflow-x: auto; flex-wrap: wrap; }
        .thumb-strip-small img { width: 80px; height: 80px; object-fit: cover; border-radius: 10px; cursor: pointer; border: 1px solid #2a3a4a; transition: 0.2s; }
        .thumb-strip-small img:hover { transform: scale(1.05); border-color: #4a9eff; }
        .admin-stats { display: flex; gap: 20px; margin-bottom: 30px; flex-wrap: wrap; }
        .stat-card { background: #0a0e17; padding: 18px 28px; border-radius: 16px; border: 1px solid #4a9eff; text-align: center; transition: 0.2s; }
        .stat-card:hover { transform: translateY(-2px); border-color: #2ecc71; }
        .stat-number { font-size: 2rem; font-weight: bold; color: #4a9eff; }
        .user-card { background: #0a0e17; padding: 14px; border-radius: 12px; margin-bottom: 12px; display: flex; align-items: center; gap: 15px; flex-wrap: wrap; border: 1px solid #2a3a4a; transition: 0.2s; }
        .user-card:hover { border-color: #4a9eff; }
        .tabs { display: flex; gap: 8px; margin-bottom: 25px; border-bottom: 1px solid #2a3a4a; flex-wrap: wrap; }
        .tab-btn { background: none; border: none; padding: 10px 22px; cursor: pointer; color: #8a9bb0; border-radius: 8px 8px 0 0; transition: 0.2s; }
        .tab-btn.active { color: #4a9eff; border-bottom: 2px solid #4a9eff; background: rgba(74,158,255,0.1); }
        .edit-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 5000; display: flex; align-items: center; justify-content: center; }
        .edit-modal > div { background: #0f141c; padding: 28px; border-radius: 20px; width: 90%; max-width: 550px; border: 1px solid #4a9eff; max-height: 90vh; overflow-y: auto; }
        .moderation-note { margin-top: 8px; padding: 8px; background: rgba(52,152,219,0.2); border-radius: 8px; font-size: 0.75rem; border-left: 3px solid #3498db; }
        .country-list { display: flex; flex-direction: column; gap: 8px; }
        .country-item { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid #2a3a4a; cursor: pointer; border-radius: 8px; transition: 0.2s; }
        .country-item:hover { background: #1a2332; color: #4a9eff; padding-left: 20px; }
        .vehicle-state-badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 500; }
        .state-oper { background: rgba(46,204,113,0.2); color: #2ecc71; border: 1px solid #2ecc71; }
        .state-repair { background: rgba(230,126,34,0.2); color: #e67e22; border: 1px solid #e67e22; }
        .state-storage { background: rgba(52,152,219,0.2); color: #3498db; border: 1px solid #3498db; }
        .state-scrap { background: rgba(149,165,166,0.2); color: #95a5a6; border: 1px solid #95a5a6; }
        .state-unknown { background: rgba(127,140,141,0.2); color: #7f8c8d; border: 1px solid #7f8c8d; }
        .profile-field { margin-bottom: 10px; padding: 8px; background: #0a0e17; border-radius: 8px; }
        .profile-label { color: #4a9eff; font-size: 0.75rem; margin-bottom: 4px; }
        .profile-value { word-break: break-word; }
        .toast { position: fixed; bottom: 25px; left: 25px; background: #2ecc71; color: #000; padding: 12px 24px; border-radius: 40px; z-index: 9999; animation: fadeOut 3s forwards; font-weight: 500; }
        @keyframes fadeOut { 0% { opacity: 1; } 70% { opacity: 1; } 100% { opacity: 0; visibility: hidden; } }
        @media (max-width: 768px) { .header { padding: 0.8rem 1rem; } .main-two-columns { flex-direction: column; } .photo-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<div id="app"></div>

<script>
    // ========== ДАННЫЕ ==========
    let currentUser = null;
    let allPhotos = [];
    let users = [];
    let votes = [];
    let comments = [];
    let notifications = [];
    let editRequests = [];
    let vehiclesProfiles = {};
    
    const VEHICLE_STATES = {
        oper: { ru: 'Эксплуатируется', icon: 'fa-play-circle', class: 'state-oper' },
        repair: { ru: 'На ремонте', icon: 'fa-wrench', class: 'state-repair' },
        storage: { ru: 'На хранении', icon: 'fa-warehouse', class: 'state-storage' },
        scrap: { ru: 'Списан', icon: 'fa-trash-alt', class: 'state-scrap' },
        unknown: { ru: 'Неизвестно', icon: 'fa-question', class: 'state-unknown' }
    };
    
    function getStateText(state) { return VEHICLE_STATES[state]?.ru || 'Неизвестно'; }
    function getStateClass(state) { return VEHICLE_STATES[state]?.class || 'state-unknown'; }
    function getStateIcon(state) { return VEHICLE_STATES[state]?.icon || 'fa-question'; }
    
    // Права доступа
    function canModerate(user) { return user && (user.role === 'admin' || user.role === 'moderator'); }
    function canEditUsers(user) { return user && user.role === 'admin'; }
    
    function initData() {
        users = [
            { id: 'admin1', name: 'Администратор', email: 'admin@multispotting.com', password: 'admin123', role: 'admin', banVote: false, banComment: false, bio: 'Главный администратор сайта', city: 'Москва', website: 'https://multispotting.com', telegram: '@multispotting', createdAt: Date.now() },
            { id: 'moder1', name: 'Фотомодератор', email: 'moder@multispotting.com', password: 'moder123', role: 'moderator', banVote: false, banComment: false, bio: 'Проверяю и редактирую фото', city: 'Санкт-Петербург', website: '', telegram: '@moder', createdAt: Date.now() },
            { id: 'demo1', name: 'Демо Пользователь', email: 'demo@mail.ru', password: 'demo123', role: 'user', banVote: false, banComment: false, bio: 'Люблю фотографировать технику и делиться снимками', city: 'Минск', website: '', telegram: '@demo', createdAt: Date.now() }
        ];
        
        allPhotos = [
            { id: 'p1', userId: 'admin1', url: 'https://picsum.photos/id/111/800/600', thumb: 'https://picsum.photos/id/111/300/200', vehicle: 'BMW M3 E46', loc: { country: 'Германия', city: 'Мюнхен', street: 'BMW Strasse' }, status: 'approved', rating: 25, likes: 18, dislikes: 2, views: 45, createdAt: Date.now() - 3600000, moderationNote: '' },
            { id: 'p2', userId: 'demo1', url: 'https://picsum.photos/id/222/800/600', thumb: 'https://picsum.photos/id/222/300/200', vehicle: 'Mercedes Actros', loc: { country: 'Германия', city: 'Берлин', street: '' }, status: 'approved', rating: 20, likes: 15, dislikes: 1, views: 32, createdAt: Date.now() - 86400000, moderationNote: '' },
            { id: 'p3', userId: 'admin1', url: 'https://picsum.photos/id/333/800/600', thumb: 'https://picsum.photos/id/333/300/200', vehicle: 'Porsche 911 GT3', loc: { country: 'Германия', city: 'Штутгарт', street: '' }, status: 'approved', rating: 28, likes: 20, dislikes: 1, views: 67, createdAt: Date.now() - 172800000, moderationNote: '' },
            { id: 'p4', userId: 'demo1', url: 'https://picsum.photos/id/444/800/600', thumb: 'https://picsum.photos/id/444/300/200', vehicle: 'Volvo FH16', loc: { country: 'Швеция', city: 'Гётеборг', street: '' }, status: 'pending', rating: 0, likes: 0, dislikes: 0, views: 0, createdAt: Date.now(), moderationNote: '' }
        ];
        
        votes = [];
        comments = [{ id: 'c1', photoId: 'p1', userId: 'demo1', text: 'Отличный снимок!', createdAt: Date.now() - 100000 }];
        notifications = [];
        editRequests = [];
        
        vehiclesProfiles = {
            'BMW M3 E46': { vehicle: 'BMW M3 E46', model: 'BMW M3 E46', year: 2003, engine: '3.2 л S54', state: 'oper', purpose: 'Спорт-купе' },
            'Mercedes Actros': { vehicle: 'Mercedes Actros', model: 'Actros MP4', year: 2018, engine: '12.8 л OM471', state: 'oper', purpose: 'Магистральный тягач' },
            'Porsche 911 GT3': { vehicle: 'Porsche 911 GT3', model: '911 GT3', year: 2022, engine: '4.0 л', state: 'oper', purpose: 'Спорткар' }
        };
        
        let saved = localStorage.getItem('mss_user');
        if (saved) {
            try {
                let u = JSON.parse(saved);
                let found = users.find(user => user.id === u.id);
                if (found) {
                    currentUser = JSON.parse(JSON.stringify(found));
                    delete currentUser.password;
                }
            } catch(e) {}
        }
        if (!currentUser) {
            let admin = users.find(u => u.role === 'admin');
            currentUser = JSON.parse(JSON.stringify(admin));
            delete currentUser.password;
        }
    }
    
    function saveSession() { if (currentUser) localStorage.setItem('mss_user', JSON.stringify({ id: currentUser.id, name: currentUser.name })); }
    function showToast(msg) { let t = document.createElement('div'); t.className = 'toast'; t.innerHTML = '<i class="fas fa-check-circle"></i> ' + msg; document.body.appendChild(t); setTimeout(() => t.remove(), 3000); }
    function addNotification(userId, title, message) { let notif = { id: Date.now() + '_' + Math.random().toString(36).substr(2, 6), userId, title, message, read: false, createdAt: Date.now() }; notifications.push(notif); if (currentUser && currentUser.id === userId) { updateNotifBadge(); showToast(message); } }
    function updateNotifBadge() { let badge = document.getElementById('notifBadge'); if (badge && currentUser) { let count = notifications.filter(n => n.userId === currentUser.id && !n.read).length; badge.textContent = count || ''; } }
    function escapeHtml(str) { return String(str || '').replace(/[&<>]/g, function(m){ return m==='&'?'&amp;':m==='<'?'&lt;':'&gt;';}); }
    function getBadgeClass(status) { return status === 'approved' ? 'badge-approved' : status === 'conditional' ? 'badge-conditional' : status === 'rejected' ? 'badge-rejected' : 'badge-pending'; }
    function getStatusText(status) { return status === 'approved' ? 'Одобрено' : status === 'conditional' ? 'Условно' : status === 'rejected' ? 'Отклонено' : 'Модерация'; }
    function formatLoc(loc) { return [loc.country, loc.city, loc.street].filter(Boolean).join(', ') || '—'; }
    function getFlag(country) { const map = { 'Германия':'de', 'Россия':'ru', 'Беларусь':'by', 'Швеция':'se' }; let code = map[country] || 'ru'; return `<span class="fi fi-${code} fis" style="width:20px; border-radius:3px;"></span>`; }
    function getUserVote(photoId) { let v = votes.find(v => v.photoId === photoId && v.userId === currentUser?.id); return v ? v.value : 0; }
    function canUserVote(user) { return user.role === 'admin' ? true : !user.banVote; }
    function canUserComment(user) { return user.role === 'admin' ? true : !user.banComment; }
    
    // ========== РЕДАКТИРОВАНИЕ ПРОФИЛЯ ==========
    function editProfile() {
        let user = users.find(u => u.id === currentUser.id);
        let modal = document.createElement('div'); modal.className = 'edit-modal';
        modal.innerHTML = `<div><h3><i class="fas fa-user-edit"></i> Редактирование профиля</h3>
            <div class="form-group"><label>Имя пользователя (ник)</label><input id="editName" value="${escapeHtml(user.name)}"></div>
            <div class="form-group"><label>О себе</label><textarea id="editBio" rows="3" placeholder="Расскажите о себе...">${escapeHtml(user.bio || '')}</textarea></div>
            <div class="form-group"><label>Город</label><input id="editCity" value="${escapeHtml(user.city || '')}" placeholder="Ваш город"></div>
            <div class="form-group"><label>Веб-сайт</label><input id="editWebsite" value="${escapeHtml(user.website || '')}" placeholder="https://..."></div>
            <div class="form-group"><label>Telegram</label><input id="editTelegram" value="${escapeHtml(user.telegram || '')}" placeholder="@username"></div>
            <div style="display:flex; gap:12px; justify-content:flex-end;"><button class="btn btn-success" onclick="saveProfileEdit()">Сохранить</button><button class="btn" onclick="this.closest('.edit-modal').remove()">Отмена</button></div>
        </div>`;
        document.body.appendChild(modal);
    }
    
    function saveProfileEdit() {
        let user = users.find(u => u.id === currentUser.id);
        if (user) {
            let newName = document.getElementById('editName').value.trim();
            if (!newName) { alert('Имя не может быть пустым'); return; }
            user.name = newName;
            user.bio = document.getElementById('editBio').value;
            user.city = document.getElementById('editCity').value;
            user.website = document.getElementById('editWebsite').value;
            user.telegram = document.getElementById('editTelegram').value;
            currentUser.name = newName;
            currentUser.bio = user.bio;
            currentUser.city = user.city;
            currentUser.website = user.website;
            currentUser.telegram = user.telegram;
            showToast('Профиль обновлён');
            document.querySelector('.edit-modal')?.remove();
            showUserProfile(currentUser.id);
            renderMainApp();
        }
    }
    
    function toggleBanVote(userId) {
        let user = users.find(u => u.id === userId);
        if (user && canEditUsers(currentUser) && user.id !== currentUser.id) {
            user.banVote = !user.banVote;
            showToast(`Голосование ${user.banVote ? 'запрещено' : 'разрешено'} для ${user.name}`);
            if (window.currentView === 'profile') showUserProfile(userId);
            if (window.currentView === 'admin') showAdminPanel();
        }
    }
    
    function toggleBanComment(userId) {
        let user = users.find(u => u.id === userId);
        if (user && canEditUsers(currentUser) && user.id !== currentUser.id) {
            user.banComment = !user.banComment;
            showToast(`Комментирование ${user.banComment ? 'запрещено' : 'разрешено'} для ${user.name}`);
            if (window.currentView === 'profile') showUserProfile(userId);
            if (window.currentView === 'admin') showAdminPanel();
        }
    }
    
    function quickVote(photoId, val) {
        if (!currentUser) { alert('Войдите чтобы голосовать'); return; }
        if (!canUserVote(currentUser)) { alert('Голосование запрещено администратором'); return; }
        let photo = allPhotos.find(p => p.id === photoId);
        if (!photo) return;
        if (photo.userId === currentUser.id) { alert('Нельзя голосовать за своё фото'); return; }
        let existing = votes.find(v => v.photoId === photoId && v.userId === currentUser.id);
        if (existing) {
            if (existing.value === val) return;
            if (val === 1) { photo.likes++; if (existing.value === -1) photo.dislikes--; }
            else { photo.dislikes++; if (existing.value === 1) photo.likes--; }
            photo.rating += (val - existing.value);
            existing.value = val;
        } else {
            if (val === 1) photo.likes++;
            else photo.dislikes++;
            photo.rating += val;
            votes.push({ id: Date.now() + '_' + Math.random(), photoId, userId: currentUser.id, value: val });
        }
        refreshCurrentView();
    }
    
    function moderatePhoto(id, status, note) {
        let photo = allPhotos.find(p => p.id === id);
        if (photo && canModerate(currentUser)) {
            photo.status = status;
            photo.moderationNote = note || '';
            let msg = status === 'approved' ? `Ваше фото "${photo.vehicle}" одобрено!` : (status === 'conditional' ? `Ваше фото "${photo.vehicle}" принято условно. Замечание: ${note || 'нет'}` : `Ваше фото "${photo.vehicle}" отклонено. Причина: ${note || 'не указана'}`);
            addNotification(photo.userId, status === 'approved' ? 'Фото одобрено' : (status === 'conditional' ? 'Фото принято условно' : 'Фото отклонено'), msg);
            showToast(`Фото ${status === 'approved' ? 'одобрено' : (status === 'conditional' ? 'принято условно' : 'отклонено')}`);
            if (window.currentView === 'admin') showAdminPanel();
            refreshCurrentView();
        }
    }
    
    function editVehicleProfile(vehicleName) {
        if (!canEditUsers(currentUser)) return;
        let profile = vehiclesProfiles[vehicleName] || {};
        let stateOptions = Object.keys(VEHICLE_STATES).map(s => `<option value="${s}" ${profile.state===s?'selected':''}>${getStateText(s)}</option>`).join('');
        let modal = document.createElement('div'); modal.className = 'edit-modal';
        modal.innerHTML = `<div><h3><i class="fas fa-edit"></i> Редактирование ТС</h3>
            <div class="form-group"><label>Модель</label><input id="editModel" value="${escapeHtml(profile.model || vehicleName)}"></div>
            <div class="form-group"><label>Год выпуска</label><input id="editYear" value="${profile.year || ''}"></div>
            <div class="form-group"><label>Двигатель</label><input id="editEngine" value="${profile.engine || ''}"></div>
            <div class="form-group"><label>Состояние</label><select id="editState">${stateOptions}</select></div>
            <div class="form-group"><label>Назначение</label><textarea id="editPurpose" rows="3">${profile.purpose || ''}</textarea></div>
            <div style="display:flex; gap:12px; justify-content:flex-end;"><button class="btn btn-success" onclick="saveVehicleProfile('${escapeHtml(vehicleName)}')">Сохранить</button><button class="btn" onclick="this.closest('.edit-modal').remove()">Отмена</button></div>
        </div>`;
        document.body.appendChild(modal);
    }
    
    function saveVehicleProfile(vehicleName) {
        let newModel = document.getElementById('editModel').value.trim();
        if (!newModel) { alert('Введите название модели'); return; }
        let profile = { vehicle: newModel, model: newModel, year: document.getElementById('editYear').value, engine: document.getElementById('editEngine').value, state: document.getElementById('editState').value, purpose: document.getElementById('editPurpose').value };
        if (newModel !== vehicleName) { delete vehiclesProfiles[vehicleName]; allPhotos.forEach(p => { if (p.vehicle === vehicleName) p.vehicle = newModel; }); }
        vehiclesProfiles[newModel] = profile;
        document.querySelector('.edit-modal')?.remove();
        showToast('Профиль ТС обновлён');
        showVehiclePage(newModel);
        refreshCurrentView();
    }
    
    function requestVehicleEdit(vehicleName) {
        let profile = vehiclesProfiles[vehicleName] || {};
        let stateOptions = Object.keys(VEHICLE_STATES).map(s => `<option value="${s}" ${profile.state===s?'selected':''}>${getStateText(s)}</option>`).join('');
        let modal = document.createElement('div'); modal.className = 'edit-modal';
        modal.innerHTML = `<div><h3><i class="fas fa-edit"></i> Предложить изменение</h3>
            <div class="form-group"><label>Модель</label><input id="reqModel" value="${profile.model || vehicleName}"></div>
            <div class="form-group"><label>Год выпуска</label><input id="reqYear" value="${profile.year || ''}"></div>
            <div class="form-group"><label>Двигатель</label><input id="reqEngine" value="${profile.engine || ''}"></div>
            <div class="form-group"><label>Состояние</label><select id="reqState">${stateOptions}</select></div>
            <div class="form-group"><label>Назначение</label><textarea id="reqPurpose">${profile.purpose || ''}</textarea></div>

            <div style="display:flex; gap:12px; justify-content:flex-end;"><button class="btn btn-success" onclick="submitEditRequest('${escapeHtml(vehicleName)}')">Отправить</button><button class="btn" onclick="this.closest('.edit-modal').remove()">Отмена</button></div>
        </div>`;

    function submitEditRequest(vehicleName) {
        let request = { id: Date.now() + '_' + Math.random().toString(36).substr(2, 6), vehicleName, userId: currentUser.id, userName: currentUser.name, changes: { model: document.getElementById('reqModel').value, year: document.getElementById('reqYear').value, engine: document.getElementById('reqEngine').value, state: document.getElementById('reqState').value, purpose: document.getElementById('reqPurpose').value }, reason: document.getElementById('reqReason').value, status: 'pending', createdAt: Date.now() };
        editRequests.push(request);
        let admin = users.find(u => u.role === 'admin');
        if (admin) addNotification(admin.id, 'Новая заявка', `Пользователь ${currentUser.name} предлагает изменения для ТС "${vehicleName}"`);
        document.querySelector('.edit-modal')?.remove();
        showToast('Заявка отправлена');
        showVehiclePage(vehicleName);
    }
    
    function approveEditRequest(requestId) { let req = editRequests.find(r => r.id == requestId); if (req && canEditUsers(currentUser)) { vehiclesProfiles[req.vehicleName] = { vehicle: req.vehicleName, ...req.changes }; req.status = 'approved'; addNotification(req.userId, 'Заявка одобрена', `Ваше предложение по ТС "${req.vehicleName}" принято`); showToast('Заявка одобрена'); showAdminPanel(); } }
    function rejectEditRequest(requestId) { let req = editRequests.find(r => r.id == requestId); if (req && canEditUsers(currentUser)) { req.status = 'rejected'; addNotification(req.userId, 'Заявка отклонена', `Ваше предложение по ТС "${req.vehicleName}" отклонено`); showToast('Заявка отклонена'); showAdminPanel(); } }
    
    function editPhoto(photoId) {
        if (!canModerate(currentUser)) return;
        let photo = allPhotos.find(p => p.id === photoId);
        if (!photo) return;
        let modal = document.createElement('div'); modal.className = 'edit-modal';
        modal.innerHTML = `<div><h3>Редактировать фото</h3><div class="form-group"><label>Транспорт</label><input id="editVeh" value="${escapeHtml(photo.vehicle)}"></div><div class="form-group"><label>Страна</label><input id="editCountry" value="${escapeHtml(photo.loc.country || '')}"></div><div class="form-group"><label>Город</label><input id="editCity" value="${escapeHtml(photo.loc.city || '')}"></div><div class="form-group"><label>Улица</label><input id="editStreet" value="${escapeHtml(photo.loc.street || '')}"></div><button class="btn btn-success" onclick="savePhotoEdit('${photoId}')">Сохранить</button><button class="btn" onclick="this.closest('.edit-modal').remove()">Отмена</button></div>`;
        document.body.appendChild(modal);
    }
    
    function savePhotoEdit(photoId) {
        let photo = allPhotos.find(p => p.id === photoId);
        if (photo && canModerate(currentUser)) {
            photo.vehicle = document.getElementById('editVeh').value.trim();
            photo.loc.country = document.getElementById('editCountry').value;
            photo.loc.city = document.getElementById('editCity').value;
            photo.loc.street = document.getElementById('editStreet').value;
            if (!vehiclesProfiles[photo.vehicle]) vehiclesProfiles[photo.vehicle] = { vehicle: photo.vehicle, model: photo.vehicle, year: '—', engine: '—', state: 'unknown', purpose: '—' };
            showToast('Фото обновлено');
            document.querySelector('.edit-modal')?.remove();
            refreshCurrentView();
        }
    }
    
    function deletePhoto(photoId) {
        if (!canModerate(currentUser)) return;
        if (confirm('Удалить это фото?')) {
            allPhotos = allPhotos.filter(p => p.id !== photoId);
            votes = votes.filter(v => v.photoId !== photoId);
            comments = comments.filter(c => c.photoId !== photoId);
            showToast('Фото удалено');
            refreshCurrentView();
        }
    }
    
    function photoCard(photo, showModActions = false, isAdminView = false) {
        let author = users.find(u => u.id === photo.userId);
        let userVote = getUserVote(photo.id);
        let canVote = currentUser && canUserVote(currentUser);
        let modActions = '';
        if (showModActions && canModerate(currentUser) && photo.status === 'pending') {
            modActions = `<div style="margin-top:10px; display:flex; gap:8px; flex-wrap:wrap;"><button class="btn btn-success" onclick="event.stopPropagation(); moderatePhoto('${photo.id}', 'approved', '')">Одобрить</button><button class="btn btn-warning" onclick="event.stopPropagation(); showModerationNoteModal('${photo.id}', 'conditional')">Условно</button><button class="btn btn-danger" onclick="event.stopPropagation(); showModerationNoteModal('${photo.id}', 'rejected')">Отклонить</button></div>`;
        }
        let adminActions = '';
        if ((isAdminView || showModActions) && canModerate(currentUser)) {
            adminActions = `<div style="margin-top:10px; display:flex; gap:8px;"><button class="btn" onclick="event.stopPropagation(); editPhoto('${photo.id}')">Редактировать</button><button class="btn btn-danger" onclick="event.stopPropagation(); deletePhoto('${photo.id}')">Удалить</button></div>`;
        }
        let modNoteHtml = '';
        if (photo.status === 'conditional' && photo.moderationNote) {
            modNoteHtml = `<div class="moderation-note">Замечание модератора: ${escapeHtml(photo.moderationNote)}</div>`;
        }
        return `<div class="photo-card" onclick="openFullscreen('${photo.id}')">
            <img src="${photo.thumb}" loading="lazy">
            <div class="photo-info">
                <div class="vehicle-name" onclick="event.stopPropagation(); showVehiclePage('${escapeHtml(photo.vehicle)}')">${photo.vehicle}</div>
                <div>${getFlag(photo.loc.country)} ${formatLoc(photo.loc)}</div>
                ${modNoteHtml}
                <div class="photo-stats"><span>Автор: <span onclick="event.stopPropagation(); showUserProfile('${photo.userId}')" style="cursor:pointer; color:#4a9eff;">${author?.name || '?'}</span></span><span>Просмотров: ${photo.views || 0}</span><span>Комментариев: ${comments.filter(c => c.photoId === photo.id).length}</span></div>
                <div class="vote-buttons">${currentUser ? (canVote ? `<button class="vote-btn vote-up ${userVote === 1 ? 'vote-active-up' : ''}" onclick="event.stopPropagation(); quickVote('${photo.id}', 1)">+ ${photo.likes || 0}</button><button class="vote-btn vote-down ${userVote === -1 ? 'vote-active-down' : ''}" onclick="event.stopPropagation(); quickVote('${photo.id}', -1)">- ${photo.dislikes || 0}</button>` : `<span style="color:#e74c3c;">Голосование запрещено</span>`) : `<span>Войдите чтобы голосовать</span>`}</div>
                ${modActions}${adminActions}
            </div>
            <div class="status-badge ${getBadgeClass(photo.status)}">${getStatusText(photo.status)}</div>
        </div>`;
    }
    
    function showModerationNoteModal(photoId, status) {
        let modal = document.createElement('div'); modal.className = 'edit-modal';
        modal.innerHTML = `<div><h3>${status === 'conditional' ? 'Условное одобрение' : 'Отклонение'}</h3><div class="form-group"><label>Замечание для пользователя</label><textarea id="modNote" rows="3" placeholder="Укажите причину..."></textarea></div><div style="display:flex; gap:12px; justify-content:flex-end;"><button class="btn btn-success" onclick="moderatePhoto('${photoId}', '${status}', document.getElementById('modNote').value); this.closest('.edit-modal').remove()">Подтвердить</button><button class="btn" onclick="this.closest('.edit-modal').remove()">Отмена</button></div></div>`;
        document.body.appendChild(modal);
    }
    
    function refreshCurrentView() {
        if (window.currentView === 'home') { renderHome(); filterGallery(); }
        else if (window.currentView === 'city') showCityPhotos(window.currentCity);
        else if (window.currentView === 'country') showCountryPhotos(window.currentCountry);
        else if (window.currentView === 'vehicle') showVehiclePage(window.currentVehicle);
        else if (window.currentView === 'profile') showUserProfile(window.currentProfileId);
        else if (window.currentView === 'admin') showAdminPanel();
        else if (window.currentView === 'contest') showContest();
        else if (window.currentView === 'notifications') showNotifications();
        else if (window.currentView === 'journal') showJournal();
    }
    
    function filterGallery() {
        let term = document.getElementById('searchInput')?.value.toLowerCase() || '';
        let visible = allPhotos.filter(p => p.status === 'approved');
        if (term) visible = visible.filter(p => p.vehicle.toLowerCase().includes(term) || (p.loc.country || '').toLowerCase().includes(term) || (p.loc.city || '').toLowerCase().includes(term));
        let grid = document.getElementById('galleryGrid');
        if (grid) grid.innerHTML = visible.slice(0, 9).map(p => photoCard(p)).join('') || '<div style="text-align:center; padding:40px;">Нет фото</div>';
    }
    
    function showContest() {
        window.currentView = 'contest';
        let topPhotos = [...allPhotos.filter(p => p.status === 'approved')].sort((a,b) => b.rating - a.rating).slice(0, 6);
        document.getElementById('mainContent').innerHTML = `<div class="section"><h2><i class="fas fa-trophy"></i> Конкурс лучших фото</h2><p style="margin-bottom: 20px;">Топ-6 фотографий по рейтингу! Голосуйте за лучшие работы.</p><div class="photo-grid">${topPhotos.map(p => photoCard(p)).join('') || '<div>Нет фото</div>'}</div><button class="btn" onclick="renderHome()">На главную</button></div>`;
    }
    
    function showNotifications() {
        window.currentView = 'notifications';
        let myNotifs = notifications.filter(n => n.userId === currentUser.id).reverse();
        myNotifs.forEach(n => n.read = true);
        updateNotifBadge();
        document.getElementById('mainContent').innerHTML = `<div class="section"><h2><i class="fas fa-bell"></i> Уведомления</h2>${myNotifs.length ? myNotifs.map(n => `<div class="user-card"><strong>${n.title}</strong><br>${n.message}<br><small>${new Date(n.createdAt).toLocaleString()}</small></div>`).join('') : '<p>Нет уведомлений</p>'}<button class="btn" onclick="renderHome()">На главную</button></div>`;
    }
    
    function renderHome() {
        window.currentView = 'home';
        let visible = allPhotos.filter(p => p.status === 'approved');
        let countries = [...new Set(visible.map(p => p.loc?.country).filter(Boolean))];
        let timeline = [...visible].sort((a,b) => b.createdAt - a.createdAt).slice(0,5).map(p => ({ date: new Date(p.createdAt).toLocaleDateString(), text: `Новое фото: ${p.vehicle}`, id: p.id }));
        let photographerStats = {};
        visible.forEach(p => { photographerStats[p.userId] = (photographerStats[p.userId] || 0) + 1; });
        let topPhotographers = Object.entries(photographerStats).sort((a,b) => b[1] - a[1]).slice(0,5).map(([userId, count]) => ({ user: users.find(u => u.id === userId), count }));
        let newThumbs = [...visible].sort((a,b) => b.createdAt - a.createdAt).slice(0,6);
        
        let html = `<div class="section"><h3><i class="fas fa-globe"></i> Страны</h3><div class="country-list">${countries.map(c => `<div class="country-item" onclick="showCountryPhotos('${escapeHtml(c)}')">${getFlag(c)} ${c} <span style="margin-left:auto; color:#8a9bb0;">(${visible.filter(p=>p.loc?.country===c).length})</span></div>`).join('')}</div></div>
        <div class="main-two-columns"><div class="main-center"><div class="section"><h3><i class="fas fa-search"></i> Поиск</h3><input type="text" id="searchInput" placeholder="Название ТС, страна или город..." style="width:100%; padding:12px; background:#0a0e17; border:1px solid #2a3a4a; border-radius:8px;" oninput="filterGallery()"><div id="galleryGrid" class="photo-grid" style="margin-top:20px;"></div></div></div>
        <div class="main-sidebar"><div class="side-block"><h4><i class="fas fa-gavel"></i> Правила сообщества</h4><div class="rules-text"><p>1. Загружайте только свои фотографии транспорта.</p><p>2. Указывайте точное место съёмки (страна, город).</p><p>3. Запрещены скриншоты и фото из интернета.</p><p>4. Уважайте других участников, без оскорблений.</p><p>5. Не спамьте и не рекламируйте посторонние ресурсы.</p><p>6. Нарушения караются блокировкой голосования/комментариев.</p><p>7. Администрация имеет право удалять фото без объяснения.</p></div></div>
        <div class="side-block"><h4><i class="fas fa-history"></i> Хронология</h4>${timeline.map(e => `<div class="timeline-item"><div class="timeline-date">${e.date}</div><div style="cursor:pointer; color:#4a9eff;" onclick="openFullscreen('${e.id}')">${e.text}</div></div>`).join('')}</div>
        <div class="side-block"><h4><i class="fas fa-camera"></i> Активные фотографы</h4>${topPhotographers.map(p => p.user ? `<div class="photographer-item" onclick="showUserProfile('${p.user.id}')"><i class="fas fa-user-circle fa-2x"></i><div><strong>${p.user.name}</strong><br><small>${p.count} фото</small></div></div>` : '').join('')}</div>
        <div class="side-block"><h4><i class="fas fa-images"></i> Новые фото</h4><div class="thumb-strip-small">${newThumbs.map(p => `<img src="${p.thumb}" onclick="openFullscreen('${p.id}')">`).join('')}</div></div></div></div>`;
        document.getElementById('mainContent').innerHTML = html;
        filterGallery();
    }

                ${user.city ? `<div class="profile-field"><div class="profile-label">Город</div><div class="profile-value">${escapeHtml(user.city)}</div></div>` : ''}
                ${user.website ? `<div class="profile-field"><div class="profile-label">Сайт</div><div class="profile-value"><a href="${escapeHtml(user.website)}" target="_blank" style="color:#4a9eff;">${escapeHtml(user.website)}</a></div></div>` : ''}
                ${user.telegram ? `<div class="profile-field"><div class="profile-label">Telegram</div><div class="profile-value">${escapeHtml(user.telegram)}</div></div>` : ''}
            </div>
            ${isOwn ? `<button class="btn" onclick="editProfile()">Редактировать профиль</button>` : ''}
            ${canManage ? `<div style="margin-top:20px; padding:15px; background:#1a2332; border-radius:12px;"><h4>Администрирование</h4><div style="display:flex; gap:12px; flex-wrap:wrap; margin-top:10px;"><button class="btn ${user.banVote ? 'btn-success' : 'btn-danger'}" onclick="toggleBanVote('${user.id}')">${user.banVote ? 'Снять запрет голосования' : 'Запретить голосование'}</button><button class="btn ${user.banComment ? 'btn-success' : 'btn-danger'}" onclick="toggleBanComment('${user.id}')">${user.banComment ? 'Снять запрет комментариев' : 'Запретить комментарии'}</button><button class="btn btn-danger" onclick="if(confirm('Удалить пользователя?')) deleteUser('${user.id}')">Удалить пользователя</button></div></div>` : ''}
            <h3 style="margin-top:20px;">Фотографии пользователя</h3>
            <div class="photo-grid">${userPhotos.map(p => photoCard(p)).join('') || '<div>Нет фото</div>'}</div>
            <button class="btn" onclick="renderHome()" style="margin-top:20px;">На главную</button>
        </div>`;
    }
    
    function showUploadForm() {
        window.currentView = 'upload';
        document.getElementById('mainContent').innerHTML = `<div class="section"><h2><i class="fas fa-cloud-upload-alt"></i> Загрузка фото</h2><div class="form-group"><label>Файл</label><input type="file" id="uploadFile" accept="image/jpeg,image/png,image/webp"></div><div class="form-group"><label>Транспорт</label><input id="uploadVehicle" placeholder="Например: BMW X5"></div><div class="form-group"><label>Страна</label><input id="uploadCountry" placeholder="Страна"></div><div class="form-group"><label>Город</label><input id="uploadCity" placeholder="Город"></div><div class="form-group"><label>Улица</label><input id="uploadStreet" placeholder="Улица"></div><button class="btn btn-success" onclick="doUpload()">Отправить на модерацию</button></div>`;
    }
    
    function doUpload() {
        let file = document.getElementById('uploadFile').files[0];
        if (!file) { alert('Выберите файл'); return; }
        let vehicle = document.getElementById('uploadVehicle').value.trim();
        if (!vehicle) { alert('Введите название транспорта'); return; }
        let reader = new FileReader();
        reader.onload = function(e) {
            let newPhoto = { id: 'p' + Date.now() + '_' + Math.random().toString(36).substr(2, 6), userId: currentUser.id, url: e.target.result, thumb: e.target.result, vehicle, loc: { country: document.getElementById('uploadCountry').value, city: document.getElementById('uploadCity').value, street: document.getElementById('uploadStreet').value }, status: 'pending', rating: 0, likes: 0, dislikes: 0, views: 0, createdAt: Date.now(), moderationNote: '' };
            allPhotos.push(newPhoto);
            if (!vehiclesProfiles[vehicle]) vehiclesProfiles[vehicle] = { vehicle, model: vehicle, year: '—', engine: '—', state: 'unknown', purpose: '—' };
            let admins = users.filter(u => u.role === 'admin' || u.role === 'moderator');
            admins.forEach(admin => addNotification(admin.id, 'Новое фото', `Пользователь ${currentUser.name} загрузил фото: ${vehicle}`));
            showToast('Фото отправлено на модерацию');
            renderHome();
        };
        reader.readAsDataURL(file);
    }
    
    function showJournal() { window.currentView = 'journal'; let myPhotos = allPhotos.filter(p => p.userId === currentUser.id); document.getElementById('mainContent').innerHTML = `<div class="section"><h2><i class="fas fa-history"></i> Мой журнал</h2><div class="photo-grid">${myPhotos.map(p => photoCard(p)).join('') || '<div>Нет фото</div>'}</div><button class="btn" onclick="renderHome()">На главную</button></div>`; }
    function showMyPhotos() { showJournal(); }
    function showStatistics() { let approved = allPhotos.filter(p => p.status === 'approved'); document.getElementById('mainContent').innerHTML = `<div class="section"><h2><i class="fas fa-chart-pie"></i> Статистика</h2><div class="admin-stats"><div class="stat-card"><div class="stat-number">${approved.length}</div><div>Одобрено</div></div><div class="stat-card"><div class="stat-number">${allPhotos.filter(p=>p.status==='pending').length}</div><div>На модерации</div></div><div class="stat-card"><div class="stat-number">${users.length}</div><div>Пользователей</div></div></div><button class="btn" onclick="renderHome()">На главную</button></div>`; }
    
    function showSwitchUserPanel() { document.getElementById('mainContent').innerHTML = `<div class="section"><h2><i class="fas fa-exchange-alt"></i> Сменить пользователя</h2><div style="display:flex; flex-direction:column; gap:10px;">${users.map(u => `<div class="user-card" style="cursor:pointer;" onclick="switchToUser('${u.id}')"><i class="fas fa-user-circle"></i> <strong>${u.name}</strong> (${u.email}) - ${u.role === 'admin' ? 'Админ' : (u.role === 'moderator' ? 'Модератор' : 'Пользователь')}</div>`).join('')}</div><button class="btn" onclick="renderHome()">На главную</button></div>`; }
    function switchToUser(userId) { let user = users.find(u => u.id === userId); if (user) { currentUser = JSON.parse(JSON.stringify(user)); delete currentUser.password; saveSession(); showToast(`Переключено на ${user.name}`); renderMainApp(); } }
    
    function showAdminPanel() {
        if (!canModerate(currentUser)) return;
        window.currentView = 'admin';
        let pending = allPhotos.filter(p => p.status === 'pending');
        let pendingRequests = editRequests.filter(r => r.status === 'pending');
        let isFullAdmin = canEditUsers(currentUser);
        
        document.getElementById('mainContent').innerHTML = `<div class="section"><h2><i class="fas fa-cogs"></i> Панель модерации</h2><div class="admin-stats"><div class="stat-card"><div class="stat-number">${allPhotos.length}</div><div>Всего фото</div></div><div class="stat-card"><div class="stat-number">${pending.length}</div><div>На модерации</div></div>${isFullAdmin ? `<div class="stat-card"><div class="stat-number">${users.length}</div><div>Пользователей</div></div><div class="stat-card"><div class="stat-number">${pendingRequests.length}</div><div>Заявки</div></div>` : ''}</div><div class="tabs"><button class="tab-btn active" onclick="switchAdminTab('moderation')">Модерация (${pending.length})</button>${isFullAdmin ? `<button class="tab-btn" onclick="switchAdminTab('requests')">Заявки (${pendingRequests.length})</button><button class="tab-btn" onclick="switchAdminTab('users')">Пользователи</button>` : ''}<button class="tab-btn" onclick="switchAdminTab('all')">Все фото</button></div><div id="adminTabContent"></div><button class="btn" onclick="renderHome()" style="margin-top:20px;">На главную</button></div>`;
        
        window.switchAdminTab = function(tab) {
            let content = document.getElementById('adminTabContent');
            if (tab === 'moderation') content.innerHTML = `<div class="photo-grid">${pending.map(p => photoCard(p, true)).join('') || '<div>Нет фото</div>'}</div>`;
            else if (tab === 'requests' && isFullAdmin) content.innerHTML = `<div>${pendingRequests.map(r => `<div class="user-card" style="flex-direction:column;"><div><strong>ТС:</strong> ${r.vehicleName}</div><div><strong>Пользователь:</strong> ${r.userName}</div><div><strong>Обоснование:</strong> ${r.reason || 'Без пояснения'}</div><div style="margin-top:10px; padding:10px; background:#0f141c; border-radius:8px;">${Object.entries(r.changes).map(([k,v]) => `<div><strong>${k}:</strong> ${v || '—'}</div>`).join('')}</div><div style="margin-top:10px;"><button class="btn btn-success" onclick="approveEditRequest('${r.id}')">Одобрить</button><button class="btn btn-danger" onclick="rejectEditRequest('${r.id}')">Отклонить</button></div></div>`).join('') || '<div>Нет заявок</div>'}</div>`;
            else if (tab === 'users' && isFullAdmin) content.innerHTML = users.map(u => `<div class="user-card"><i class="fas fa-user-circle fa-2x"></i><div><strong>${u.name}</strong><br><small>${u.email}</small><br>Роль: ${u.role === 'admin' ? 'Админ' : (u.role === 'moderator' ? 'Модератор' : 'Пользователь')}<br>Голосование: ${u.banVote ? 'Запрещено' : 'Разрешено'}<br>Комментарии: ${u.banComment ? 'Запрещены' : 'Разрешены'}</div><div style="margin-left:auto; display:flex; gap:8px;"><select id="role_${u.id}"><option ${u.role === 'user' ? 'selected' : ''}>user</option><option ${u.role === 'moderator' ? 'selected' : ''}>moderator</option><option ${u.role === 'admin' ? 'selected' : ''}>admin</option></select><button class="btn" onclick="changeUserRole('${u.id}', document.getElementById('role_${u.id}').value)">Сохранить</button><button class="btn ${u.banVote ? 'btn-success' : 'btn-warning'}" onclick="toggleBanVote('${u.id}')">Голосование</button><button class="btn ${u.banComment ? 'btn-success' : 'btn-warning'}" onclick="toggleBanComment('${u.id}')">Комментарии</button>${u.id !== currentUser.id ? `<button class="btn btn-danger" onclick="deleteUser('${u.id}')">Удалить</button>` : ''}</div></div>`).join('');
            else content.innerHTML = `<div class="photo-grid">${allPhotos.map(p => photoCard(p, false, true)).join('')}</div>`;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
        };
        switchAdminTab('moderation');
    }
    
    function changeUserRole(userId, newRole) { 
        let user = users.find(u => u.id === userId);
        if (user && canEditUsers(currentUser) && user.id !== currentUser.id) {
            user.role = newRole;
            showToast(`Роль изменена на ${newRole === 'admin' ? 'Администратор' : (newRole === 'moderator' ? 'Модератор' : 'Пользователь')}`);
            showAdminPanel();
        }
    }
    
    function deleteUser(userId) { 
        if (!canEditUsers(currentUser)) return;
        if (userId === currentUser.id) { alert('Нельзя удалить себя'); return; }
        if (confirm('Удалить пользователя и все его фото?')) {
            users = users.filter(u => u.id !== userId);
            allPhotos = allPhotos.filter(p => p.userId !== userId);
            votes = votes.filter(v => v.userId !== userId);
            comments = comments.filter(c => c.userId !== userId);
            notifications = notifications.filter(n => n.userId !== userId);
            showToast('Пользователь удалён');
            showAdminPanel();
            renderHome();
        }
    }
    
    function openFullscreen(id) {
        let photo = allPhotos.find(p => p.id === id);
        if (!photo) return;
        photo.views = (photo.views || 0) + 1;
        let photoComments = comments.filter(c => c.photoId === id);
        let canComment = currentUser && canUserComment(currentUser);
        let viewer = document.getElementById('fullscreenViewer');
        viewer.innerHTML = `<button class="fullscreen-close" onclick="closeFullscreen()"><i class="fas fa-times"></i></button><div class="fullscreen-image"><img src="${photo.url}"></div><div class="fullscreen-info"><h3>${photo.vehicle}</h3><div>${getFlag(photo.loc.country)} ${formatLoc(photo.loc)}</div><div>Просмотров: ${photo.views}</div><h4>Комментарии</h4><div id="fsComments">${photoComments.map(c => `<div class="comment"><strong>${users.find(u=>u.id===c.userId)?.name}</strong>: ${c.text}</div>`).join('')}</div>${currentUser ? (canComment ? `<div style="display:flex; gap:12px; margin-top:18px;"><input id="fsCommentInput" placeholder="Написать комментарий..." style="flex:1; padding:10px; background:#0a0e17; border:1px solid #2a3a4a; border-radius:8px;"><button class="btn btn-success" onclick="addFullscreenComment('${id}')">Отправить</button></div>` : `<p style="color:#e74c3c;">Комментирование запрещено</p>`) : `<p>Войдите чтобы комментировать</p>`}</div>`;
        viewer.classList.add('active');
    }
    function addFullscreenComment(id) { let text = document.getElementById('fsCommentInput')?.value; if (text && currentUser && canUserComment(currentUser)) { comments.push({ id: 'c' + Date.now(), photoId: id, userId: currentUser.id, text: text, createdAt: Date.now() }); openFullscreen(id); } }
    function closeFullscreen() { document.getElementById('fullscreenViewer').classList.remove('active'); }
    
    function showAuth() { document.getElementById('app').innerHTML = `<div style="max-width:450px; margin:80px auto; background:#0f141c; padding:35px; border-radius:24px; border:1px solid #2a3a4a; text-align:center;"><h2>Multi Spotting Site</h2><div style="background:#1a2332; padding:10px; border-radius:8px; margin:20px 0;"><div><strong>admin@multispotting.com</strong> / <strong>admin123</strong> (админ)</div><div><strong>moder@multispotting.com</strong> / <strong>moder123</strong> (модератор)</div><div><strong>demo@mail.ru</strong> / <strong>demo123</strong> (пользователь)</div></div><input id="loginEmail" placeholder="Email" style="width:100%; padding:12px; margin:12px 0; background:#0a0e17; border:1px solid #2a3a4a; border-radius:10px; color:white;"><input type="password" id="loginPassword" placeholder="Пароль" style="width:100%; padding:12px; margin:12px 0; background:#0a0e17; border:1px solid #2a3a4a; border-radius:10px; color:white;"><button class="btn btn-success" onclick="doLogin()" style="width:100%;">Войти</button><div style="margin-top:20px; cursor:pointer; color:#4a9eff;" onclick="showRegisterForm()">Регистрация</div></div>`; }
    function doLogin() { let email = document.getElementById('loginEmail').value, password = document.getElementById('loginPassword').value, user = users.find(u => u.email === email && u.password === password); if (user) { currentUser = JSON.parse(JSON.stringify(user)); delete currentUser.password; saveSession(); renderMainApp(); } else alert('Неверный email или пароль'); }
    function showRegisterForm() { document.getElementById('app').innerHTML = `<div style="max-width:450px; margin:80px auto; background:#0f141c; padding:35px; border-radius:24px;"><h2 style="text-align:center;">Регистрация</h2><input id="regName" placeholder="Имя" style="width:100%; padding:12px; margin:12px 0; background:#0a0e17; border:1px solid #2a3a4a; border-radius:10px; color:white;"><input id="regEmail" placeholder="Email" style="width:100%; padding:12px; margin:12px 0; background:#0a0e17; border:1px solid #2a3a4a; border-radius:10px; color:white;"><input type="password" id="regPassword" placeholder="Пароль (мин. 4)" style="width:100%; padding:12px; margin:12px 0; background:#0a0e17; border:1px solid #2a3a4a; border-radius:10px; color:white;"><button class="btn btn-success" onclick="doRegister()" style="width:100%;">Зарегистрироваться</button><div style="margin-top:20px; text-align:center; cursor:pointer; color:#4a9eff;" onclick="showAuth()">Войти</div></div>`; }
    function doRegister() { let name = document.getElementById('regName').value, email = document.getElementById('regEmail').value, password = document.getElementById('regPassword').value; if (!name || !email || password.length < 4) { alert('Заполните все поля'); return; } if (users.find(u => u.email === email)) { alert('Email уже используется'); return; } let newUser = { id: 'user_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6), name, email, password, role: 'user', banVote: false, banComment: false, bio: '', city: '', website: '', telegram: '', createdAt: Date.now() }; users.push(newUser); alert('Регистрация успешна!'); showAuth(); }
    function logout() { localStorage.removeItem('mss_user'); currentUser = null; showAuth(); }
    
    function renderMainApp() {
        if (!currentUser) { showAuth(); return; }
        updateNotifBadge();
        let roleBadge = '';
        if (currentUser.role === 'admin') roleBadge = '<span class="admin-badge">ADMIN</span>';
        else if (currentUser.role === 'moderator') roleBadge = '<span class="moder-badge">MODERATOR</span>';
        let banInfo = (!canUserVote(currentUser) && currentUser.role !== 'admin') ? '<span class="banned-badge">Голосование заблокировано</span>' : '';
        document.getElementById('app').innerHTML = `<div class="header"><div class="logo-area" onclick="renderHome()"><i class="fas fa-camera-retro logo"></i><span class="site-title">Multi Spotting Site</span></div><div class="user-info"><span><i class="fas fa-user"></i> ${currentUser.name}</span>${roleBadge}${banInfo}<button class="menu-btn" id="menuToggleBtn"><i class="fas fa-bars"></i><span id="notifBadge" class="notif-badge"></span></button></div></div><div class="side-menu" id="sideMenu"><div class="menu-header"><span>Меню</span><button id="closeMenuBtn"><i class="fas fa-times"></i></button></div><ul class="menu-list"><li onclick="showUserProfile('${currentUser.id}')"><i class="fas fa-user"></i> Профиль</li><li onclick="showStatistics()"><i class="fas fa-chart-line"></i> Статистика</li><li onclick="showUploadForm()"><i class="fas fa-upload"></i> Загрузка</li><li onclick="showJournal()"><i class="fas fa-history"></i> Журнал</li><li onclick="showMyPhotos()"><i class="fas fa-images"></i> Мои фото</li><li onclick="showContest()"><i class="fas fa-trophy"></i> Конкурс</li><li onclick="showNotifications()"><i class="fas fa-bell"></i> Уведомления</li><li onclick="showSwitchUserPanel()"><i class="fas fa-exchange-alt"></i> Сменить пользователя</li>${canModerate(currentUser) ? '<li onclick="showAdminPanel()"><i class="fas fa-cogs"></i> Модерация</li>' : ''}<li onclick="logout()"><i class="fas fa-sign-out-alt"></i> Выход</li></ul></div><div class="container" id="mainContent"></div><div id="fullscreenViewer" class="fullscreen-viewer"></div>`;
        document.getElementById('menuToggleBtn').onclick = () => document.getElementById('sideMenu').classList.add('open');
        document.getElementById('closeMenuBtn').onclick = () => document.getElementById('sideMenu').classList.remove('open');
        renderHome();
    }
    
    initData();
    renderMainApp();
    
    window.quickVote = quickVote; window.moderatePhoto = moderatePhoto; window.changeUserRole = changeUserRole; window.deleteUser = deleteUser;
    window.showCityPhotos = showCityPhotos; window.showCountryPhotos = showCountryPhotos; window.showVehiclePage = showVehiclePage;
    window.showUserProfile = showUserProfile; window.renderHome = renderHome; window.showUploadForm = showUploadForm; window.doUpload = doUpload;
    window.showAdminPanel = showAdminPanel; window.showJournal = showJournal; window.showMyPhotos = showMyPhotos; window.showStatistics = showStatistics;
    window.showContest = showContest; window.showNotifications = showNotifications; window.showSwitchUserPanel = showSwitchUserPanel;
    window.switchToUser = switchToUser; window.logout = logout; window.doLogin = doLogin; window.doRegister = doRegister;
    window.showAuth = showAuth; window.showRegisterForm = showRegisterForm; window.filterGallery = filterGallery;
    window.openFullscreen = openFullscreen; window.closeFullscreen = closeFullscreen; window.addFullscreenComment = addFullscreenComment;
    window.editPhoto = editPhoto; window.deletePhoto = deletePhoto; window.editVehicleProfile = editVehicleProfile;
    window.requestVehicleEdit = requestVehicleEdit; window.approveEditRequest = approveEditRequest; window.rejectEditRequest = rejectEditRequest;
    window.toggleBanVote = toggleBanVote; window.toggleBanComment = toggleBanComment;
    window.editProfile = editProfile;
</script>
</body>
</html>
