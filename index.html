    function showUploadForm() {
        window.currentView = 'upload';
        document.getElementById('mainContent').innerHTML = `<div class="section"><h2 style="font-size:1rem;"><i class="fas fa-cloud-upload-alt"></i> Загрузка фото</h2>
            <div class="form-group"><label>Файл</label><input type="file" id="uploadFile" accept="image/jpeg,image/png,image/webp"></div>
            <div class="form-group"><label>Транспорт</label><input id="uploadVehicle" placeholder="Например: BMW X5"></div>
            <div class="form-group"><label>Модель (для фильтра)</label><input id="uploadModel" placeholder="Например: BMW M3"></div>
            <div class="form-group"><label>Страна</label><input id="uploadCountry" placeholder="Страна"></div>
            <div class="form-group"><label>Город</label><input id="uploadCity" placeholder="Город"></div>
            <div class="form-group"><label>Улица</label><input id="uploadStreet" placeholder="Улица"></div>
            <div class="form-group"><label>Тип фото</label><select id="uploadType"><option value="false">Обычное</option><option value="true">Фотозарисовка</option></select></div>
            <div class="form-group"><label>Отметьте место съёмки на карте (кликните по карте)</label>
                <div class="map-container" id="uploadMap" style="height:220px;"></div>
                <input type="hidden" id="uploadLat" value="0">
                <input type="hidden" id="uploadLng" value="0">
            </div>
            <button class="btn btn-success" onclick="doUpload()">Отправить на модерацию</button>
        </div>`;
        setTimeout(() => {
            try {
                const map = L.map('uploadMap').setView([55.76, 37.64], 10);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
                }).addTo(map);
                let marker = null;
                map.on('click', function(e) {
                    if (marker) map.removeLayer(marker);
                    marker = L.marker(e.latlng).addTo(map);
                    document.getElementById('uploadLat').value = e.latlng.lat;
                    document.getElementById('uploadLng').value = e.latlng.lng;
                    showToast('Координаты установлены');
                });
                setTimeout(() => map.invalidateSize(), 200);
            } catch(e) { console.error('Ошибка карты загрузки:', e); }
        }, 200);
    }
    
    async function doUpload() {
        let file = document.getElementById('uploadFile').files[0];
        if (!file) { alert('Выберите файл'); return; }
        let vehicle = document.getElementById('uploadVehicle').value.trim();
        if (!vehicle) { alert('Введите название транспорта'); return; }
        let model = document.getElementById('uploadModel').value.trim() || vehicle;
        let lat = parseFloat(document.getElementById('uploadLat').value);
        let lng = parseFloat(document.getElementById('uploadLng').value);
        if (!lat || !lng) { alert('Отметьте место съёмки на карте'); return; }
        
        const btn = event.target;
        btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Загрузка...';
        
        const reader = new FileReader();
        reader.onload = async function(e) {
            try {
                const newPhoto = {
                    id: 'p' + Date.now() + '_' + Math.random().toString(36).substr(2, 9),
                    userId: currentUser.id,
                    url: e.target.result,
                    thumb: e.target.result,
                    vehicle: vehicle,
                    model: model,
                    loc: {
                        country: document.getElementById('uploadCountry').value,
                        city: document.getElementById('uploadCity').value,
                        street: document.getElementById('uploadStreet').value,
                        lat: lat, lng: lng
                    },
                    status: 'pending',
                    rating: 0, likes: 0, dislikes: 0, views: 0,
                    createdAt: Date.now(),
                    moderationNote: '',
                    exif: {},
                    isSketch: document.getElementById('uploadType').value === 'true'
                };
                await putToStore('photos', newPhoto);
                allPhotos.push(newPhoto);
                if (!vehiclesProfiles[vehicle]) {
                    vehiclesProfiles[vehicle] = { vehicle: vehicle, model: model, year: '—', engine: '—', state: 'unknown', purpose: '—', company: '—', plate: '—', vin: '—', color: '—', mileage: '—' };
                    await putToStore('vehiclesProfiles', vehiclesProfiles[vehicle]);
                }
                let moderators = users.filter(u => u.role === 'admin' || u.role === 'moderator');
                for (let mod of moderators) {
                    await addNotification(mod.id, 'Новое фото', `Пользователь ${currentUser.name} загрузил ${newPhoto.isSketch ? 'фотозарисовку' : 'фото'}: ${vehicle}`);
                }
                showToast('Фото отправлено на модерацию');
                document.getElementById('uploadFile').value = '';
                document.getElementById('uploadVehicle').value = '';
                document.getElementById('uploadModel').value = '';
                document.getElementById('uploadCountry').value = '';
                document.getElementById('uploadCity').value = '';
                document.getElementById('uploadStreet').value = '';
                renderHome();
            } catch(err) { alert('Ошибка при загрузке: ' + err.message); }
            finally { btn.disabled = false; btn.innerHTML = 'Отправить на модерацию'; }
        };
        reader.onerror = function() { 
            alert('Ошибка чтения файла'); 
            btn.disabled = false; 
            btn.innerHTML = 'Отправить на модерацию'; 
        };
        reader.readAsDataURL(file);
    }
    
    function showJournal() { window.currentView = 'journal'; let myPhotos = allPhotos.filter(p => p.userId === currentUser.id); document.getElementById('mainContent').innerHTML = `<div class="section"><h2 style="font-size:1rem;"><i class="fas fa-history"></i> Мой журнал</h2><div class="photo-grid">${myPhotos.map(p => photoCard(p)).join('') || '<div>Нет фото</div>'}</div><button class="btn" onclick="renderHome()">На главную</button></div>`; }
    function showMyPhotos() { showJournal(); }
    function showStatistics() { 
        let approved = allPhotos.filter(p => p.status === 'approved'); 
        let sketches = allPhotos.filter(p => p.status === 'approved' && p.isSketch === true);
        let models = [...new Set(approved.map(p => p.model || p.vehicle))];
        document.getElementById('mainContent').innerHTML = `<div class="section"><h2 style="font-size:1rem;"><i class="fas fa-chart-pie"></i> Статистика</h2>
            <div class="stats-grid">
                <div class="stat-card"><div class="stat-number">${approved.length}</div><div>Одобрено</div></div>
                <div class="stat-card"><div class="stat-number">${allPhotos.filter(p=>p.status==='pending').length}</div><div>На модерации</div></div>
                <div class="stat-card"><div class="stat-number">${sketches.length}</div><div>Фотозарисовки</div></div>
                <div class="stat-card"><div class="stat-number">${users.length}</div><div>Пользователей</div></div>
                <div class="stat-card"><div class="stat-number">${models.length}</div><div>Моделей</div></div>
                <div class="stat-card"><div class="stat-number">${new Set(approved.map(p => p.loc?.country)).size}</div><div>Стран</div></div>
            </div>
            <button class="btn" onclick="renderHome()" style="margin-top:12px;">На главную</button></div>`; 
    }
    
    function showSwitchUserPanel() { document.getElementById('mainContent').innerHTML = `<div class="section"><h2 style="font-size:1rem;"><i class="fas fa-exchange-alt"></i> Сменить пользователя</h2><div style="display:flex; flex-direction:column; gap:6px;">${users.map(u => `<div class="user-card" style="cursor:pointer; flex-direction:row;" onclick="switchToUser('${u.id}')"><i class="fas fa-user-circle" style="font-size:1.6rem;"></i> <strong>${u.name}</strong> <span style="color:#9aafc4; font-size:0.75rem;">(${u.email})</span> - ${u.role === 'admin' ? 'Админ' : (u.role === 'moderator' ? 'Модератор' : 'Пользователь')}</div>`).join('')}</div><button class="btn" onclick="renderHome()">На главную</button></div>`; }
    async function switchToUser(userId) { let user = users.find(u => u.id === userId); if (user) { currentUser = JSON.parse(JSON.stringify(user)); delete currentUser.password; saveSession(); showToast(`Переключено на ${user.name}`); renderMainApp(); } }
    
    // ========== АДМИН-ПАНЕЛЬ ==========
    async function showAdminPanel() {
        if (!canModerate(currentUser)) return;
        window.currentView = 'admin';
        let pending = allPhotos.filter(p => p.status === 'pending');
        let pendingRequests = editRequests.filter(r => r.status === 'pending');
        let isFullAdmin = canEditUsers(currentUser);
        
        document.getElementById('mainContent').innerHTML = `<div class="section"><h2 style="font-size:1rem;"><i class="fas fa-cogs"></i> Панель модерации</h2><div class="admin-stats"><div class="stat-card"><div class="stat-number">${allPhotos.length}</div><div>Всего фото</div></div><div class="stat-card"><div class="stat-number">${pending.length}</div><div>На модерации</div></div>${isFullAdmin ? `<div class="stat-card"><div class="stat-number">${users.length}</div><div>Пользователей</div></div><div class="stat-card"><div class="stat-number">${pendingRequests.length}</div><div>Заявки</div></div>` : ''}</div><div class="tabs"><button class="tab-btn active" onclick="switchAdminTab('moderation')">Модерация (${pending.length})</button>${isFullAdmin ? `<button class="tab-btn" onclick="switchAdminTab('requests')">Заявки (${pendingRequests.length})</button><button class="tab-btn" onclick="switchAdminTab('users')">Пользователи</button>` : ''}<button class="tab-btn" onclick="switchAdminTab('all')">Все фото</button><button class="tab-btn" onclick="switchAdminTab('comments')">Комментарии (${comments.length})</button></div><div id="adminTabContent"></div><button class="btn" onclick="renderHome()" style="margin-top:10px;">На главную</button></div>`;
        
        window.switchAdminTab = function(tab) {
            let content = document.getElementById('adminTabContent');
            if (tab === 'moderation') content.innerHTML = `<div class="photo-grid">${pending.map(p => photoCard(p, true)).join('') || '<div>Нет фото</div>'}</div>`;
            else if (tab === 'requests' && isFullAdmin) content.innerHTML = `<div>${pendingRequests.map(r => `<div class="user-card" style="flex-direction:column;"><div><strong>ТС:</strong> ${r.vehicleName}</div><div><strong>Пользователь:</strong> ${r.userName}</div><div><strong>Обоснование:</strong> ${r.reason || 'Без пояснения'}</div><div style="margin-top:6px; padding:6px; background:#0e1722; border-radius:6px; font-size:0.8rem;">${Object.entries(r.changes).map(([k,v]) => `<div><strong>${k}:</strong> ${v || '—'}</div>`).join('')}</div><div style="margin-top:6px;"><button class="btn btn-success" onclick="approveEditRequest('${r.id}')">Одобрить</button><button class="btn btn-danger" onclick="rejectEditRequest('${r.id}')">Отклонить</button></div></div>`).join('') || '<div>Нет заявок</div>'}</div>`;
            else if (tab === 'users' && isFullAdmin) content.innerHTML = users.map(u => `<div class="user-card"><div class="user-row"><i class="fas fa-user-circle" style="font-size:1.8rem;"></i><div><strong>${u.name}</strong><br><small style="color:#9aafc4;">${u.email}</small><br><span style="font-size:0.75rem;">Роль: ${u.role === 'admin' ? 'Админ' : (u.role === 'moderator' ? 'Модератор' : 'Пользователь')}</span><br><span style="font-size:0.75rem;">Голосование: ${u.banVote ? 'Запрещено' : 'Разрешено'}</span><br><span style="font-size:0.75rem;">Комментарии: ${u.banComment ? 'Запрещены' : 'Разрешены'}</span></div></div><div class="user-actions"><select id="role_${u.id}" style="padding:3px 6px; background:#0e1722; border:1px solid #2a3d4f; border-radius:6px; color:#eef3f8; font-size:0.7rem;"><option ${u.role === 'user' ? 'selected' : ''}>user</option><option ${u.role === 'moderator' ? 'selected' : ''}>moderator</option><option ${u.role === 'admin' ? 'selected' : ''}>admin</option></select><button class="btn" onclick="changeUserRole('${u.id}', document.getElementById('role_${u.id}').value)">Сохранить</button><button class="btn ${u.banVote ? 'btn-success' : 'btn-warning'}" onclick="toggleBanVote('${u.id}')">Голосование</button><button class="btn ${u.banComment ? 'btn-success' : 'btn-warning'}" onclick="toggleBanComment('${u.id}')">Комментарии</button>${u.id !== currentUser.id ? `<button class="btn btn-danger" onclick="deleteUser('${u.id}')">Удалить</button>` : ''}</div></div>`).join('');
            else if (tab === 'comments') {
                content.innerHTML = `<div>${comments.map(c => {
                    let photo = allPhotos.find(p => p.id === c.photoId);
                    let author = users.find(u => u.id === c.userId);
                    let canDelete = (currentUser.id === c.userId || canModerate(currentUser));
                    return `<div class="comment"><div><strong>${author?.name || '?'}</strong>: ${c.text} <br><small style="color:#9aafc4;">к фото: ${photo?.vehicle || '?'}</small></div><div class="comment-actions">${canDelete ? `<button class="del-comment" onclick="deleteComment('${c.id}')"><i class="fas fa-trash-alt"></i></button>` : ''}</div></div>`;
                }).join('') || 'Нет комментариев'}</div>`;
            }
            else content.innerHTML = `<div class="photo-grid">${allPhotos.map(p => photoCard(p, false, true)).join('')}</div>`;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            if (event && event.target) event.target.classList.add('active');
        };
        switchAdminTab('moderation');
    }
    
    async function changeUserRole(userId, newRole) { 
        let user = users.find(u => u.id === userId);
        if (user && canEditUsers(currentUser) && user.id !== currentUser.id) {
            user.role = newRole;
            await putToStore('users', user);
            showToast(`Роль изменена на ${newRole === 'admin' ? 'Администратор' : (newRole === 'moderator' ? 'Модератор' : 'Пользователь')}`);
            showAdminPanel();
        }
    }
    
    async function deleteUser(userId) { 
        if (!canEditUsers(currentUser)) return;
        if (userId === currentUser.id) { alert('Нельзя удалить себя'); return; }
        if (confirm('Удалить пользователя и все его фото?')) {
            await deleteFromStore('users', userId);
            users = users.filter(u => u.id !== userId);
            const userPhotos = allPhotos.filter(p => p.userId === userId);
            for (const p of userPhotos) await deleteFromStore('photos', p.id);
            allPhotos = allPhotos.filter(p => p.userId !== userId);
            votes = votes.filter(v => v.userId !== userId);
            comments = comments.filter(c => c.userId !== userId);
            notifications = notifications.filter(n => n.userId !== userId);
            showToast('Пользователь удалён');
            showAdminPanel();
            renderHome();
        }
    }
    
    // ========== КАРТОЧКА ФОТО ==========
    function photoCard(photo, showModActions = false, isAdminView = false) {
        let author = users.find(u => u.id === photo.userId);
        let userVote = getUserVote(photo.id);
        let canVote = currentUser && canUserVote(currentUser);
        let modActions = '';
        if (showModActions && canModerate(currentUser) && photo.status === 'pending') {
            modActions = `<div style="margin-top:6px; display:flex; gap:4px; flex-wrap:wrap;"><button class="btn btn-success" onclick="event.stopPropagation(); moderatePhoto('${photo.id}', 'approved', '')">Одобрить</button><button class="btn btn-warning" onclick="event.stopPropagation(); showModerationNoteModal('${photo.id}', 'conditional')">Условно</button><button class="btn btn-danger" onclick="event.stopPropagation(); showModerationNoteModal('${photo.id}', 'rejected')">Отклонить</button></div>`;
        }
        let adminActions = '';
        if ((isAdminView || showModActions) && canModerate(currentUser)) {
            adminActions = `<div style="margin-top:6px; display:flex; gap:4px; flex-wrap:wrap;"><button class="btn" onclick="event.stopPropagation(); editPhoto('${photo.id}')">Редактировать</button><button class="btn btn-danger" onclick="event.stopPropagation(); deletePhoto('${photo.id}')">Удалить</button></div>`;
        }
        let modNoteHtml = '';
        if (photo.status === 'conditional' && photo.moderationNote) {
            modNoteHtml = `<div class="moderation-note">Замечание модератора: ${escapeHtml(photo.moderationNote)}</div>`;
        }
        let mapLink = '';
        if (photo.loc && photo.loc.lat && photo.loc.lng) {
            mapLink = `<div class="map-pin" onclick="event.stopPropagation(); showMapForPhoto('${photo.id}')"><i class="fas fa-map-pin"></i> Показать место съёмки</div>`;
        }
        let sketchTag = photo.isSketch ? '<span class="sketch-tag">Фотозарисовка</span>' : '';
        let modelTag = photo.model ? `<span class="sketch-tag"><i class="fas fa-tag"></i> ${photo.model}</span>` : '';
        return `<div class="photo-card" onclick="showPhotoPage('${photo.id}')">
            <img src="${photo.thumb}" loading="lazy">
            <div class="photo-info">
                <div class="vehicle-name" onclick="event.stopPropagation(); showVehiclePage('${escapeHtml(photo.vehicle)}')">${photo.vehicle} ${sketchTag}</div>
                <div style="font-size:0.7rem; color:#9aafc4;">${modelTag}</div>
                <div style="font-size:0.8rem;">${getFlag(photo.loc.country)} ${formatLoc(photo.loc)}</div>
                ${mapLink}
                ${modNoteHtml}
                <div class="photo-stats"><span>Автор: <span onclick="event.stopPropagation(); showUserProfile('${photo.userId}')" style="cursor:pointer; color:#4f9fff;">${author?.name || '?'}</span></span><span>Просмотров: ${photo.views || 0}</span><span>Комментариев: ${comments.filter(c => c.photoId === photo.id).length}</span></div>
                <div class="vote-buttons">${currentUser ? (canVote ? `<button class="vote-btn vote-up ${userVote === 1 ? 'vote-active-up' : ''}" onclick="event.stopPropagation(); quickVote('${photo.id}', 1)"><i class="fas fa-plus"></i> ${photo.likes || 0}</button><button class="vote-btn vote-down ${userVote === -1 ? 'vote-active-down' : ''}" onclick="event.stopPropagation(); quickVote('${photo.id}', -1)"><i class="fas fa-minus"></i> ${photo.dislikes || 0}</button>` : `<span style="color:#e74c3c; font-size:0.75rem;">Голосование запрещено</span>`) : `<span style="font-size:0.75rem;">Войдите чтобы голосовать</span>`}</div>
                ${modActions}${adminActions}
            </div>
            <div class="status-badge ${getBadgeClass(photo.status)}">${getStatusText(photo.status)}</div>
        </div>`;
    }
    
    // ========== АВТОРИЗАЦИЯ ==========
    function showAuth() { document.getElementById('app').innerHTML = `<div style="max-width:380px; margin:40px auto; background:#111a24; padding:24px 16px; border-radius:18px; border:1px solid #2a3d4f; text-align:center;"><h2 style="font-size:1.2rem;">Multi Spotting Site</h2><div style="background:#1a2633; padding:8px; border-radius:8px; margin:12px 0; font-size:0.75rem; text-align:left;"><div><strong>admin@multispotting.com</strong> / admin123 (админ)</div><div><strong>moder@multispotting.com</strong> / moder123 (модератор)</div><div><strong>demo@mail.ru</strong> / demo123 (пользователь)</div></div><input id="loginEmail" placeholder="Email" style="width:100%; padding:10px; margin:8px 0; background:#0e1722; border:1px solid #2a3d4f; border-radius:10px; color:white; font-size:0.9rem;"><input type="password" id="loginPassword" placeholder="Пароль" style="width:100%; padding:10px; margin:8px 0; background:#0e1722; border:1px solid #2a3d4f; border-radius:10px; color:white; font-size:0.9rem;"><button class="btn btn-success" onclick="doLogin()" style="width:100%;">Войти</button><div style="margin-top:12px; cursor:pointer; color:#4f9fff; font-size:0.85rem;" onclick="showRegisterForm()">Регистрация</div></div>`; }
    async function doLogin() { let email = document.getElementById('loginEmail').value, password = document.getElementById('loginPassword').value, user = users.find(u => u.email === email && u.password === password); if (user) { currentUser = JSON.parse(JSON.stringify(user)); delete currentUser.password; saveSession(); renderMainApp(); } else alert('Неверный email или пароль'); }
    function showRegisterForm() { document.getElementById('app').innerHTML = `<div style="max-width:380px; margin:40px auto; background:#111a24; padding:24px 16px; border-radius:18px; border:1px solid #2a3d4f;"><h2 style="font-size:1.2rem; text-align:center;">Регистрация</h2><input id="regName" placeholder="Имя" style="width:100%; padding:10px; margin:8px 0; background:#0e1722; border:1px solid #2a3d4f; border-radius:10px; color:white; font-size:0.9rem;"><input id="regEmail" placeholder="Email" style="width:100%; padding:10px; margin:8px 0; background:#0e1722; border:1px solid #2a3d4f; border-radius:10px; color:white; font-size:0.9rem;"><input type="password" id="regPassword" placeholder="Пароль (мин. 4)" style="width:100%; padding:10px; margin:8px 0; background:#0e1722; border:1px solid #2a3d4f; border-radius:10px; color:white; font-size:0.9rem;"><button class="btn btn-success" onclick="doRegister()" style="width:100%;">Зарегистрироваться</button><div style="margin-top:12px; text-align:center; cursor:pointer; color:#4f9fff; font-size:0.85rem;" onclick="showAuth()">Войти</div></div>`; }
    async function doRegister() { let name = document.getElementById('regName').value, email = document.getElementById('regEmail').value, password = document.getElementById('regPassword').value; if (!name || !email || password.length < 4) { alert('Заполните все поля'); return; } if (users.find(u => u.email === email)) { alert('Email уже используется'); return; } let newUser = { id: 'user_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6), name, email, password, role: 'user', banVote: false, banComment: false, bio: '', city: '', website: '', telegram: '', createdAt: Date.now() }; await putToStore('users', newUser); users.push(newUser); alert('Регистрация успешна!'); showAuth(); }
    function logout() { localStorage.removeItem('mss_user'); currentUser = null; showAuth(); }
    
    // ========== ГЛАВНАЯ РЕНДЕРИНГ ==========
    async function renderMainApp() {
        if (!currentUser) { showAuth(); return; }
        updateNotifBadge();
        let roleBadge = '';
        if (currentUser.role === 'admin') roleBadge = '<span class="admin-badge">ADMIN</span>';
        else if (currentUser.role === 'moderator') roleBadge = '<span class="moder-badge">MODERATOR</span>';
        let banInfo = (!canUserVote(currentUser) && currentUser.role !== 'admin') ? '<span class="banned-badge">Голосование заблокировано</span>' : '';
        document.getElementById('app').innerHTML = `<div class="header"><div class="logo-area" onclick="renderHome()"><i class="fas fa-camera-retro logo"></i><span class="site-title">Multi Spotting Site</span></div><div class="user-info"><span><i class="fas fa-user"></i> ${currentUser.name}</span>${roleBadge}${banInfo}<button class="menu-btn" id="menuToggleBtn"><i class="fas fa-bars"></i><span id="notifBadge" class="notif-badge"></span></button></div></div><div class="side-menu" id="sideMenu"><div class="menu-header"><span>Меню</span><button id="closeMenuBtn" style="background:none;border:none;color:#4f9fff;font-size:1.2rem;cursor:pointer;"><i class="fas fa-times"></i></button></div><ul class="menu-list"><li onclick="showUserProfile('${currentUser.id}')"><i class="fas fa-user"></i> Профиль</li><li onclick="showStatistics()"><i class="fas fa-chart-line"></i> Статистика</li><li onclick="showUploadForm()"><i class="fas fa-upload"></i> Загрузка</li><li onclick="showJournal()"><i class="fas fa-history"></i> Журнал</li><li onclick="showMyPhotos()"><i class="fas fa-images"></i> Мои фото</li><li onclick="showSketchGallery()"><i class="fas fa-paint-brush"></i> Фотозарисовки</li><li onclick="showContest()"><i class="fas fa-trophy"></i> Конкурс</li><li onclick="showNotifications()"><i class="fas fa-bell"></i> Уведомления</li><li onclick="showSwitchUserPanel()"><i class="fas fa-exchange-alt"></i> Сменить пользователя</li>${canModerate(currentUser) ? '<li onclick="showAdminPanel()"><i class="fas fa-cogs"></i> Модерация</li>' : ''}<li onclick="logout()"><i class="fas fa-sign-out-alt"></i> Выход</li></ul></div><div class="container" id="mainContent"></div><div id="fullscreenViewer" class="fullscreen-viewer"></div>`;
        document.getElementById('menuToggleBtn').onclick = () => document.getElementById('sideMenu').classList.add('open');
        document.getElementById('closeMenuBtn').onclick = () => document.getElementById('sideMenu').classList.remove('open');
        renderHome();
    }
    
    // ========== ЗАПУСК ==========
    (async function() {
        document.getElementById('app').innerHTML = '<div class="loading-overlay"><div class="loading-spinner"></div><div>Загрузка данных...</div></div>';
        try {
            await initDB();
            await loadAllData();
            renderMainApp();
        } catch(e) {
            console.error('Ошибка запуска:', e);
            document.getElementById('app').innerHTML = '<div style="padding:30px;text-align:center;color:#e74c3c;">Ошибка загрузки приложения. Попробуйте обновить страницу.</div>';
        }
    })();
    
    // Глобальные функции
    window.quickVote = quickVote; window.moderatePhoto = moderatePhoto; window.changeUserRole = changeUserRole; window.deleteUser = deleteUser;
    window.showCityPhotos = showCityPhotos; window.showCountryPhotos = showCountryPhotos; window.showVehiclePage = showVehiclePage;
    window.showUserProfile = showUserProfile; window.renderHome = renderHome; window.showUploadForm = showUploadForm; window.doUpload = doUpload;
    window.showAdminPanel = showAdminPanel; window.showJournal = showJournal; window.showMyPhotos = showMyPhotos; window.showStatistics = showStatistics;
    window.showContest = showContest; window.showNotifications = showNotifications; window.showSwitchUserPanel = showSwitchUserPanel;
    window.switchToUser = switchToUser; window.logout = logout; window.doLogin = doLogin; window.doRegister = doRegister;
    window.showAuth = showAuth; window.showRegisterForm = showRegisterForm; window.filterGallery = filterGallery;
    window.editPhoto = editPhoto; window.deletePhoto = deletePhoto; window.editVehicleProfile = editVehicleProfile;
    window.requestVehicleEdit = requestVehicleEdit; window.approveEditRequest = approveEditRequest; window.rejectEditRequest = rejectEditRequest;
    window.toggleBanVote = toggleBanVote; window.toggleBanComment = toggleBanComment;
    window.editProfile = editProfile; window.showMapForPhoto = showMapForPhoto; window.deleteComment = deleteComment;
    window.showPhotoPage = showPhotoPage; window.toggleCollapse = toggleCollapse; window.addPhotoPageComment = addPhotoPageComment;
    window.showSketchGallery = showSketchGallery; window.showRandomPhoto = showRandomPhoto; window.showModelStats = showModelStats;
</script>
